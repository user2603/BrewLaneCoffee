apiVersion: v1
kind: Namespace
metadata:
  name: pr-preview-87
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: brew-app-pr87
  namespace: pr-preview-87
spec:
  replicas: 1
  selector:
    matchLabels:
      app: brew-app-pr87
  template:
    metadata:
      labels:
        app: brew-app-pr87
    spec:
      containers:
      - name: nginx
        image: nginx:1.25-alpine
        ports:
        - containerPort: 80
        volumeMounts:
        - name: site
          mountPath: /usr/share/nginx/html/index.html
          subPath: index.html
      volumes:
      - name: site
        configMap:
          name: brew-app-pr87-html
---
apiVersion: v1
kind: Service
metadata:
  name: brew-app-pr87-svc
  namespace: pr-preview-87
spec:
  selector:
    app: brew-app-pr87
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
